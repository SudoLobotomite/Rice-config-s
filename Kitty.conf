# Kitty color scheme — Patagonia Sunset
# Palette inspired by the uploaded pink-sky / blue-shadow mountain wallpaper.
# Save as: ~/.config/kitty/kitty.conf

# --- Main colors ---
foreground              #f4dce8
background              #171722
selection_foreground     #171722
selection_background     #f0a6bd
cursor                  #f4b2c8
cursor_text_color       #171722
url_color               #91c9e8

# --- Window / tab colors ---
active_border_color     #e99aaa
inactive_border_color   #454454
bell_border_color       #f0a6bd

active_tab_foreground   #171722
active_tab_background   #e99aaa
inactive_tab_foreground #d5c0d1
inactive_tab_background #292735
tab_bar_background      #171722

# --- Search ---
color0  #252431
color8  #625b70

# --- Red / coral ---
color1  #c65f78
color9  #ef8294

# --- Green / muted alpine ---
color2  #779b9b
color10 #9fc5c1

# --- Yellow / sunset gold ---
color3  #c9949c
color11 #f0b9b5

# --- Blue / glacial ---
color4  #627fba
color12 #91bde5

# --- Magenta / rose ---
color5  #a66f98
color13 #dca0c8

# --- Cyan / ice ---
color6  #5c9db4
color14 #91d2e5

# --- White / snow ---
color7  #d7cbd9
color15 #fff0f3

# --- Optional typography and spacing ---
# Uncomment if you want to enforce this font:
font_family      JetBrainsMono Nerd Font
# bold_font        auto
# italic_font      auto
# bold_italic_font auto
font_size        9.0

# Keep terminal backgrounds opaque and comfortable to read.
background_opacity 0.5
blur 1
